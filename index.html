<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VK Cleaner</title>
<style>
  body { font-family: sans-serif; max-width: 800px; margin: 20px auto; padding: 16px; }
  button { padding: 10px 16px; margin: 4px; cursor: pointer; }
  .group { display: flex; align-items: center; padding: 8px; border-bottom: 1px solid #eee; }
  .group input { margin-right: 10px; }
  #progress { margin: 10px 0; font-weight: bold; }
  input#appId { padding: 8px; width: 200px; }
</style>
</head>
<body>

<h1>VK Cleaner</h1>

<div id="authBlock">
  <p>APP ID: <input id="appId" type="text" placeholder="Введи App ID с dev.vk.com"></p>
  <button onclick="login()">Войти через ВКонтакте</button>
</div>

<div id="mainBlock" style="display:none">
  <button onclick="loadGroups()">Загрузить группы</button>
  <button onclick="unsubSelected()">Отписаться от выбранных</button>
  <button onclick="logout()">Выйти</button>
  <div id="progress"></div>
  <div id="list"></div>
</div>

<script>
const API_V = '5.131';
// ⚠️ ВАЖНО: этот путь должен совпадать с Redirect URI в настройках VK-приложения
const REDIRECT_URI = 'https://giraffcontest.github.io/cleaner/';

let token = localStorage.getItem('vk_token');
let groups = [];

function getAppId() {
  return document.getElementById('appId').value.trim();
}

function login() {
  const appId = getAppId();
  if (!appId) { alert('Введи APP ID'); return; }
  localStorage.setItem('vk_app_id', appId);
  const url = `https://oauth.vk.com/authorize?client_id=${appId}` +
              `&display=page&redirect_uri=${encodeURIComponent(REDIRECT_URI)}` +
              `&scope=groups&response_type=token&v=${API_V}`;
  window.location.href = url;
}

function checkTokenFromUrl() {
  const hash = window.location.hash.substring(1);
  if (!hash) return;
  const params = new URLSearchParams(hash);
  const t = params.get('access_token');
  if (t) {
    localStorage.setItem('vk_token', t);
    // Возвращаемся на чистый URL (без хеша с токеном)
    window.history.replaceState({}, document.title, '/cleaner/');
    window.location.reload();
  }
}

function logout() {
  localStorage.removeItem('vk_token');
  location.reload();
}

async function api(method, params = {}) {
  const url = new URL(`https://api.vk.com/method/${method}`);
  url.searchParams.set('access_token', token);
  url.searchParams.set('v', API_V);
  for (const [k, v] of Object.entries(params)) url.searchParams.set(k, v);
  const r = await fetch(url);
  const j = await r.json();
  if (j.error) throw new Error(j.error.error_msg);
  return j.response;
}

async function loadGroups() {
  document.getElementById('progress').textContent = 'Загрузка...';
  try {
    const res = await api('groups.get', { extended: 1, count: 1000, fields: 'name' });
    groups = res.items.map(g => ({ id: g.id, name: g.name, selected: true }));
    renderList();
    document.getElementById('progress').textContent = `Загружено: ${groups.length}`;
  } catch (e) {
    document.getElementById('progress').textContent = 'Ошибка: ' + e.message;
  }
}

function renderList() {
  const list = document.getElementById('list');
  list.innerHTML = '';
  groups.forEach((g, i) => {
    const div = document.createElement('div');
    div.className = 'group';
    div.innerHTML = `<input type="checkbox" ${g.selected ? 'checked' : ''} data-i="${i}">
                     <span>${g.name} (id: ${g.id})</span>`;
    div.querySelector('input').onchange = e => groups[i].selected = e.target.checked;
    list.appendChild(div);
  });
}

async function unsubSelected() {
  const ids = groups.filter(g => g.selected).map(g => g.id);
  if (!ids.length) { alert('Ничего не выбрано'); return; }
  if (!confirm(`Отписаться от ${ids.length} групп?`)) return;

  const prog = document.getElementById('progress');
  let done = 0;
  const batches = chunk(ids, 25);

  for (let i = 0; i < batches.length; i++) {
    const batch = batches[i];
    for (const id of batch) {
      try { await api('groups.leave', { group_id: id }); } catch(e) {}
      done++;
      prog.textContent = `Отписано: ${done} / ${ids.length}`;
      await sleep(350);
    }
    if (i < batches.length - 1) await sleep(1000);
  }
  prog.textContent = `Готово! Отписался от ${done} групп.`;
  loadGroups();
}

function chunk(arr, size) {
  const res = [];
  for (let i = 0; i < arr.length; i += size) res.push(arr.slice(i, i + size));
  return res;
}
const sleep = ms => new Promise(r => setTimeout(r, ms));

// init
checkTokenFromUrl();
if (token) {
  document.getElementById('authBlock').style.display = 'none';
  document.getElementById('mainBlock').style.display = 'block';
  const savedId = localStorage.getItem('vk_app_id');
  if (savedId) document.getElementById('appId').value = savedId;
}
</script>

</body>
</html>
